[project]
name = "transit-pulse-pipeline"
version = "0.1.0"
description = "Packs, decodes and checks the raw GTFS-Realtime archive recorded by the transit-pulse Worker."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "gtfs-realtime-bindings>=3.0.0",
    "pyarrow>=26.0.0",
    "zstandard>=0.25.0",
]

[project.scripts]
transit-pulse = "transit_pulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
]
